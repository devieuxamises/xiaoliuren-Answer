/* 五行生克 */
const WX = { 木:{sheng:"火",ke:"土"}, 火:{sheng:"土",ke:"金"}, 土:{sheng:"金",ke:"水"}, 金:{sheng:"水",ke:"木"}, 水:{sheng:"木",ke:"火"} };

/* 体用断事项（邵一尘：生出/生入/克出/克入/比肩/比劫） */
const USE_MATTER = {
  生出:["病、出行旅行消耗、事业工作付出","泄气，主动付出多"],
  生入:["灾、工作学习、搬家调动迁移","得外力，有进益"],

/* 问卦类别识别 */
const DIM = [
  { key:"健康", kw:["病","感冒","咳嗽","发烧","身体","疼","痛","痒","恢复","健康","好","猫","犬","喉咙","咽","鼻","胃","手术","医","包","肿","结节","癌"] },

function detectKind(q){ for(const d of DIM){ if(d.kw.some(k=>q.includes(k))) return d.key; } return "事业"; }
function land(start, n){ return (start + (n - 1)) % 6; }
function rel(a,b){ if(a===b) return ["比和","两宫同气，力量集中也易固着"]; if(WX[a].sheng===b) return ["生","前势推动后势，发展较顺"]; if(WX[a].ke===b) return ["克","前势压制后势，推进有阻"]; if(WX[b].sheng===a) return ["被生","后势反哺前势，条件渐补足"]; return ["被克","后势反制前势，局面可能转向"]; }
function bodyUse(body, branch){ const B=[["子","水",true],["丑","土",false],["寅","木",true],["卯","木",false],["辰","土",true],["巳","火",false],["午","火",true],["未","土",false],["申","金",true],["酉","金",false],["戌","土",true],["亥","水",false]]; const b=B[branch-1]; if(body.e===b[1]) return b[2]?["比肩","时辰与体同气，得同类助力"]:["比劫","同类并见，可能协力也可能竞争分夺"]; const r=rel(b[1],body.e)[0]; if(r==="生") return ["用生体","时辰生扶人宫，外部条件有助"]; if(r==="克") return ["用克体","时辰克制人宫，外部压力或阻碍"]; const r2=rel(body.e,b[1])[0]; if(r2==="生") return ["体生用","主体付出、消耗或主动推动"]; return ["体克用","主体能主动掌控，也伴随克耗"]; }

/* ① 评分：人宫（结果）为核心，地宫（过程）作参考，生克不计分 */
function judge(h2, h3){
  const base = h3.score;                    // 人宫核心
  const process = Math.round(h2.score * 0.5); // 地宫过程参考（半权重）
  const score = base + process;
  return score;
}

/* ② 正面回答：针对所问类型 + 吉凶等级，直接回答 */
function directAnswer(q, kind, score){
  const neg = score <= -2, mildNeg = score === -1, mid = score === 0, mildPos = score === 1, pos = score >= 2;
  if(kind === "健康"){
    if(neg) return "好转信号不足，建议尽快就医，勿以卦代医";

    if(mid) return "转归尚不明确，以检查结果为准";
    if(mildPos) return "偏向能好，转归向好";
    return "偏向能好，整体无大碍，静养调理即可";
  }
  if(kind === "财运"){
    if(neg) return "偏向亏损或破财，宜守慎、暂停投入";
    if(mildNeg) return "收益不佳，先控成本、防破耗";

    if(mildPos) return "偏向有小利或进账，宜见好就收";
    return "偏向有收益，但需控制仓位、不追高";

  if(kind === "感情"){
    if(neg) return "偏向难成或关系受阻，不宜强求";
    if(mildNeg) return "关系有波折，先观察对方真实态度";
    if(mid) return "走向未定，看对方持续行动而非言语";

    if(neg) return "偏向不能成或明显受阻，应准备替代方案";
    if(mildNeg) return "成事难度较大，需先解决卡点";
    if(mid) return "成败未定，关键条件尚未形成";
    if(mildPos) return "偏向能成，但要主动落实关键动作";
    return "偏向能成，条件较有利，宜抓紧推进";

  if(kind === "出行"){
    if(neg) return "偏向不宜出行或行程不顺，宜另择";

  }
  if(kind === "失物"){
    if(neg) return "找回难度大，建议同步挂失或止损";
    if(mildNeg) return "线索较弱，沿最后位置排查";
    if(mid) return "去向不明，先确认是否真带出";
    if(mildPos) return "仍有找回机会，尽快沿路径排查";
    return "偏向能找回，从固定、原处开始找";
  }
  if(kind === "官非"){
    if(neg) return "偏向不利，官非口舌须防，留好证据";
    if(mildNeg) return "易生纠纷，谨慎言行、保存凭据";
    if(mid) return "以书面与证据为准，勿口头承诺";
    if(mildPos) return "偏向能和解或有利，仍要留证";
    return "偏向有利，纠纷易解";
  }
  if(kind === "人际"){
    if(neg) return "关系偏紧张，先设边界、避免激化";
    if(mildNeg) return "有隔阂，先降低期待、观察";
    if(mid) return "关系平平，以行动而非猜测判断";
    if(mildPos) return "偏向和顺，可主动沟通";
    return "关系和合，宜增进往来";
  }
  // 默认
  if(neg) return "偏向不能成或明显受阻";
  if(mildNeg) return "成事难度较大，先处理阻碍";
  if(mid) return "成败未定，需继续落实";
  if(mildPos) return "偏向能成，但需主动推进";
  return "偏向能成，条件有利";
}

/* ④ 语境化生克：不同领域下「生/克」的具体含义 */
function shengKeContext(relType, a, b, kind){
  // a 为前宫，b 为后宫；relType 为 a 对 b 的关系
  const sheng = (x,y)=>WX[x].sheng===y;
  const ke = (x,y)=>WX[x].ke===y;
  if(kind === "健康"){
    if(ke(a,b)) return { s:"克", t:`${a}克${b}：` + (a==="金" ? "外伤、手术、器械损伤之象" : a==="木" ? "肝木克脾胃土，消化或皮下结节之象" : a==="火" ? "火克金，炎症波及肺、咽喉" : a==="土" ? "脾胃湿热壅滞" : "水克火，代谢不利"), good:false };
    if(ke(b,a)) return { s:"被克", t:`${b}克${a}：` + (b==="水" && a==="火" ? "水克火，炎症消退、热势得解（向好）" : b==="金" ? "金克木，外伤或手术信息" : b==="土" ? "土克水，水肿、阻滞" : b==="木" ? "木克土，肝木乘脾" : "火克金，炎症损及肺"), good: b==="水"&&a==="火" };
    if(sheng(a,b)) return { s:"生", t:`${a}生${b}：` + (a==="火" ? "火势蔓延、炎症加重" : a==="木" ? "木生火，郁而化热" : "气血滋养，趋于恢复"), good: a==="火" ? false : true };
    return { s:"比和", t:"同气，症状表现集中", good:false };
  }
  if(kind === "财运"){
    if(ke(a,b)) return { s:"克", t:`${a}克${b}：我克为财，主占有、进财、投资`, good:true };
    if(ke(b,a)) return { s:"被克", t:`${b}克${a}：克我为官鬼，主破财、压力、官非`, good:false };
    if(sheng(a,b)) return { s:"生", t:`${a}生${b}：我生为耗，主支出、投入、花费`, good:false };
    return { s:"被生", t:`${b}生${a}：生我为印，主进财、有助`, good:true };
  }
  if(kind === "感情"){
    if(ke(a,b)) return { s:"克", t:`${a}克${b}：一方压制一方，易起争执、争夺`, good:false };
    if(ke(b,a)) return { s:"被克", t:`${b}克${a}：关系受制，付出感失衡`, good:false };
    if(sheng(a,b)) return { s:"生", t:`${a}生${b}：互相滋养，关系升温、有助`, good:true };
    return { s:"被生", t:`${b}生${a}：对方付出更多，关系有进益`, good:true };
  }
  if(kind === "事业"){
    if(ke(a,b)) return { s:"克", t:`${a}克${b}：我克为财/成果，主能拿下、有产出`, good:true };
    if(ke(b,a)) return { s:"被克", t:`${b}克${a}：克我为官，主考核、压力、上级约束`, good:false };
    if(sheng(a,b)) return { s:"生", t:`${a}生${b}：我生为付出，主投入、铺路`, good:false };
    return { s:"被生", t:`${b}生${a}：生我为扶助，主有贵人、资源支持`, good:true };
  }
  // 通用
  if(relType==="生") return { s:"生", t:`${a}生${b}：前势推动后势，发展较顺`, good:true };
  if(relType==="克") return { s:"克", t:`${a}克${b}：前势压制后势，推进有阻`, good:false };
  if(relType==="被生") return { s:"被生", t:`${b}生${a}：后势反哺前势，条件补足`, good:true };
  if(relType==="被克") return { s:"被克", t:`${b}克${a}：后势反制前势，局面转向`, good:false };
  return { s:"比和", t:"两宫同气，力量集中", good:false };
}

/* 起卦方式 */
let curMode = "num";
let curNums = [1, 2, 3];
function setMode(mode){
  curMode = mode;
  ["num","clock","lunar","manual"].forEach(m=>{
    const tab = document.getElementById("tab-"+m), box = document.getElementById("mode-"+m);
    if(m === mode){ tab.className = "py-2 rounded-lg text-xs font-medium bg-amber-400/20 text-amber-300 border border-amber-400/40 transition"; box.classList.remove("hidden"); }
    else { tab.className = "py-2 rounded-lg text-xs font-medium bg-slate-800 text-slate-400 border border-slate-700 transition"; box.classList.add("hidden"); }
  });
}
function hourToBranch(hour){ if(hour === 23 || hour === 0) return 1; return Math.floor((hour + 1) / 2) + 1; }
function norm(n){ return n === 0 ? 10 : n; }
function fillClock(){ const d = new Date(); curNums = [norm(d.getHours()), norm(d.getMinutes()), norm(d.getSeconds())]; document.getElementById("clockShow").innerText = `取到：${curNums.join(" · ")}`; document.getElementById("hour").value = hourToBranch(d.getHours()); }
function fillLunar(){ const d = new Date(); let month=1, day=1, label=""; try { const p = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", { month:"numeric", day:"numeric" }).formatToParts(d); month = parseInt(p.find(x=>x.type==="month")?.value)||1; day = parseInt(p.find(x=>x.type==="day")?.value)||1; label = new Intl.DateTimeFormat("zh-CN-u-ca-chinese", { month:"long", day:"numeric" }).format(d); } catch(e){ label = month+"月"+day+"日"; } const branch = hourToBranch(d.getHours()); curNums = [month, day, branch]; document.getElementById("lunarShow").innerText = `取到：${label} · ${branch}时辰（${curNums.join(" · ")}）`; document.getElementById("hour").value = branch; }
setMode("num");

/* ============ 主流程 ============ */
function cast(){
  const q = document.getElementById("q").value.trim() || "未记名问事";
  let n1, n2, n3;

  n1 = Math.max(1, n1); n2 = Math.max(1, n2); n3 = Math.max(1, n3);
  const h = parseInt(document.getElementById("hour").value);

  const h1 = G[i1], h2 = G[i2], h3 = G[i3];
  const r1 = rel(h1.e, h2.e), r2 = rel(h2.e, h3.e);

  const kind = detectKind(q);

  const answer = directAnswer(q, kind, score);
  const ctx1 = shengKeContext(r1[0], h1.e, h2.e, kind);  // 天→地
  const ctx2 = shengKeContext(r2[0], h2.e, h3.e, kind);  // 地→人
  const useM = USE_MATTER[use[0]] || ["",""];

  document.getElementById("result").classList.remove("hidden");
  document.getElementById("result").innerHTML = `
  <!-- ===== 本地核心（不可改） ===== -->

      <span class="text-xs px-2.5 py-1 rounded-full border border-slate-700 ${score>=0?"text-emerald-400":"text-rose-400"}">${score>=1?"偏吉":score<=-1?"偏凶":"中性"}</span>
    </div>

    <div class="bg-slate-900/70 border border-slate-800 rounded-xl p-3">
      <div class="text-xs text-amber-400/80 font-semibold mb-1">排盘推算过程</div>
      <p class="text-slate-300 text-xs font-mono leading-relaxed">
        天宫（取数 ${n1}）：大安起顺数 ${n1} 位${n1>6?`（${n1}÷6=${Math.floor(n1/6)}余${n1%6}）`:''} → 落【${h1.n}】<br>
        地宫（取数 ${n2}）：以【${h1.n}】起顺数 ${n2} 位 → 落【${h2.n}】<br>
        人宫（取数 ${n3}）：以【${h2.n}】起顺数 ${n3} 位${n3>6?`（${n3}÷6=${Math.floor(n3/6)}余${n3%6}）`:''} → 落【${h3.n}】
      </p>

    <div class="grid grid-cols-3 gap-2 text-center">

    <div class="text-sm font-bold text-slate-200 mb-3">🤖 AI 深度解读（扩充，不改变上方核心）</div>

  </div>

  <p class="text-slate-500 text-xs text-center">验证方式：以现实客观结果为准；若现实与此相反，以现实为准。同一件事条件未变前勿重复起卦。</p>`;

  document.getElementById("result").scrollIntoView({behavior:"smooth"});
  if(dsKey) askAI(q, { h1, h2, h3, r1, r2, use, kind, n1, n2, n3, tend, answer, ctx1, ctx2, useM });

function advice(n, kind, score){
  const map = { 大安:"宜守不宜冒进，按既定条件稳步落实，静养守成。", 留连:"先解除中间卡点与拖延环节，设明确期限，别急着扩张。", 速喜:"抓住眼前的短期窗口，尽快完成一个可验证的关键动作，但别拖。", 赤口:"降低冲突与损耗，暂停高风险动作，重要沟通留痕、谨防口舌。", 小吉:"主动利用流动、协作与人脉推进，但每一步以真实反馈为准，加倍努力。", 空亡:"先核实前提是否成立，暂停追加投入，准备替代或退出方案。" };
  const kmap = { 健康:"如有不适，急症或严重症状请立即就医，勿以卦代医。", 财运:"控制预算与仓位，不借贷、不追损，先算净盈亏。", 感情:"看对方持续行动而非一时言语，边界与自尊优先。", 事业:"把外部承诺转成可检查的节点和书面条件。", 出行:"以官方通知、票务和现实交通条件为准，安全第一。", 失物:"沿最后位置、经手人和移动路径排查，必要时挂失。", 官非:"留存书面与证据，勿口头承诺，必要时咨询专业意见。", 人际:"以行动而非猜测判断，安全、边界、个人承受力优先。" };
  return `${map[n]}${kmap[kind] ? " "+kmap[kind] : ""}`;
}

/* ============ AI 扩充（DeepSeek） ============ */

请基于以上本地核心，扩充成完整深度解读。`;

  try {
